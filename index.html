<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Retro World 🕹️</title>
    <link rel="icon" type="image/png" href="Logo retrô neon Pixel Legacy.png">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <div class="logo-container">
            <img src="Logo retrô neon Pixel Legacy.png" alt="Retro World Logo" class="logo-site">
            <div>
                <h1>Pixel Legacy 🕹️</h1>
                <p>A melhor loja de jogos retrô!</p>
            </div>
        </div>
    </header>
    <main class="container">
        <div class="titulo-secao">
            <div>
                <h2>Nosso Catálogo</h2>
                <p>Conheça os jogos disponíveis</p>
            </div>
            <button id="btnCadastrar" type="button">+ Cadastrar Jogo</button>
        </div>
        <section id="listaDiscos" class="listarDiscos">
            <p id="mensagemVazia">Nenhum jogo cadastrado ainda</p>
        </section>
    </main>
    <dialog id="modalCadastro">
        <h2>Novo Jogo</h2>
        <form id="formDisco">
            <label for="album">Nome do Jogo</label>
            <input type="text" id="album" required>
            <label for="artista">Empresa</label>
            <input type="text" id="artista" required>
            <label for="genero">Data de Lançamento</label>
            <input type="date" id="genero" required>
            <label for="imagem">URL da imagem do jogo</label>
            <input type="url" id="imagem" placeholder="https://site.com" required>
            <label for="preco">Preço (R$)</label>
            <input type="number" id="preco" min="0.01" step="0.01" required>
            <div class="acoes">
                <button type="button" id="btnCancelar" class="cancelar">Cancelar</button>
                <button type="submit">Salvar jogo</button>
            </div>
        </form>
    </dialog>
    <script src="script.js"></script>
</body>
</html>
